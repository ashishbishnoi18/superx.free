<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
  <!-- The SuperX mark: an X crossing where the rising arm stops short and
       the ember tick completes it. Growth that resolves into something
       published. Ink strokes, one ember terminal — the same two-colour
       rule the rest of the product follows. As a favicon the ink flips in
       dark browser chrome so the mark stays visible. -->
  <style>
    @media (prefers-color-scheme: dark) {
      path { stroke: #EDE9E3; }
    }
  </style>
  <path d="M4.75 4.75 19.25 19.25" stroke="#23201C" stroke-width="2.5" stroke-linecap="round" />
  <path d="M4.75 19.25 13.6 10.4" stroke="#23201C" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="18.25" cy="5.75" r="3" fill="#BC4B00" />
</svg>
